name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.6.0"

      - name: Run ruff
        run: ruff check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install mypy
        run: |
          python -m pip install --upgrade pip
          pip install "mypy>=1.11.0"

      - name: Run mypy
        run: mypy app core

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.13" ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('config/models.yaml', 'config/retrieval.yaml') }}
          restore-keys: |
            hf-${{ runner.os }}-

      - name: Run tests with coverage
        env:
          # Optional: when the secret is absent these resolve to empty strings,
          # so live OpenAI tests self-skip and the suite stays green.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Optional: raises HuggingFace Hub rate limits. Public models need no token.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pytest --cov=app --cov=core --cov-report=term-missing --cov-fail-under=78

  deploy-smoke:
    name: Deploy smoke (chart + image)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Lint and render the Helm chart
        run: |
          set -euo pipefail
          helm lint deployment/helm/genai-platform
          helm template smoke deployment/helm/genai-platform > /tmp/helm-default.yaml
          for env in dev staging prod; do
            helm template smoke deployment/helm/genai-platform \
              -f "deployment/helm/genai-platform/values.$env.yaml" \
              > "/tmp/helm-$env.yaml"
          done

      - name: Render the Kustomize overlays
        run: |
          set -euo pipefail
          for env in dev staging prod; do
            kubectl kustomize --load-restrictor LoadRestrictionsNone \
              "deployment/kustomize/overlays/$env" > "/tmp/kustomize-$env.yaml"
          done

      - name: Build the image
        run: |
          set -euo pipefail
          docker build -f deployment/Dockerfile -t genai-platform:smoke .

      - name: Run the container and assert /health + /ready
        run: |
          set -euo pipefail
          docker run -d --name genai-smoke -p 8000:8000 \
            -v "$PWD/deployment/smoke/config:/app/config:ro" \
            genai-platform:smoke
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1 \
              && curl -fsS http://localhost:8000/ready >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          docker logs genai-smoke
          if [ "$ready" -ne 1 ]; then
            echo "::error::container did not become healthy/ready"
            exit 1
          fi
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/ready

      - name: Stop the container
        if: always()
        run: docker rm -f genai-smoke || true

