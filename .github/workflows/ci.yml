name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.6.0"

      - name: Run ruff
        run: ruff check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install mypy
        run: |
          python -m pip install --upgrade pip
          pip install "mypy>=1.11.0"

      - name: Run mypy
        run: mypy app core

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.13" ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('config/models.yaml', 'config/retrieval.yaml') }}
          restore-keys: |
            hf-${{ runner.os }}-

      - name: Run tests with coverage
        env:
          # Optional: when the secret is absent these resolve to empty strings,
          # so live OpenAI tests self-skip and the suite stays green.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Optional: raises HuggingFace Hub rate limits. Public models need no token.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pytest --cov=app --cov=core --cov-report=term-missing --cov-fail-under=78
