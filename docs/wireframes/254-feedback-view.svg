<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760"><!-- svg-source:excalidraw --><rect x="0" y="0" width="1200" height="760" fill="#ffffff"/><g font-family="system-ui, -apple-system, Segoe UI, sans-serif"><rect x="20" y="20" width="1160" height="720" rx="12" fill="#ffffff" stroke="#d0d7de"/><rect x="20" y="20" width="1160" height="44" rx="8" fill="#f6f8fa" stroke="#d0d7de"/><text x="40" y="50" font-size="16" fill="#1f2328" font-weight="700">Feedback</text><rect x="40" y="80" width="1120" height="52" rx="8" fill="#ddf4ff" stroke="#b6e3ff"/><text x="56" y="110" font-size="13" fill="#0969da">Privacy &amp; redaction - notes stay out of share links; exports are redacted</text><rect x="40" y="150" width="1120" height="72" rx="8" fill="#f6f8fa" stroke="#d0d7de"/><text x="56" y="190" font-size="14" fill="#0969da" font-weight="600">Total | Flagged | Promoted | Open flags</text><rect x="40" y="240" width="1120" height="92" rx="8" fill="#ffffff" stroke="#d0d7de"/><text x="56" y="270" font-size="13" fill="#1f2328" font-weight="700">Reason breakdown</text><text x="56" y="296" font-size="13" fill="#57606a">incorrect [####] 3    unsupported [##] 2    unsafe [#] 1</text><rect x="40" y="350" width="1120" height="180" rx="8" fill="#ffffff" stroke="#d0d7de"/><text x="56" y="382" font-size="12" fill="#1f2328" font-weight="700">Request id | Reason | State | Query | Reviewer note | Tenant | User | Created</text><text x="56" y="412" font-size="12" fill="#57606a">req-1042 | unsupported | flagged | What is our refund window? | Check policy v3 | finance | a.nguyen | 2026-11-25</text><text x="56" y="442" font-size="12" fill="#57606a">req-1039 | incorrect | promoted | What plan includes SSO? | Updated from docs | sales | m.chen | 2026-11-24</text><rect x="40" y="550" width="1120" height="48" rx="8" fill="#f6f8fa" stroke="#d0d7de"/><text x="56" y="580" font-size="13" fill="#1f2328">Export feedback (JSON)   Export feedback (CSV)   Review select