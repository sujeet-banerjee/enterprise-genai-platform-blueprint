apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: genai-platform
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
spec:
  ingressClassName: nginx
  rules:
    - host: genai.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: genai-platform
                port:
                  number: 8000
