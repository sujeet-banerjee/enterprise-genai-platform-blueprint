apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base manifests only. Config is generated by the overlays from the real
# repo `config/` directory (see overlays/*/kustomization.yaml), so there is
# no duplicated YAML to drift. Build overlays with:
#   kubectl kustomize --load-restrictor LoadRestrictionsNone deployment/kustomize/overlays/dev
namespace: genai-platform

resources:
  - deployment.yaml
  - service.yaml
  - pvc.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: genai-platform
    includeSelectors: false
