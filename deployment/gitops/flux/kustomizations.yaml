apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: genai-platform-dev
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./deployment/kustomize/overlays/dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: genai-platform
  targetNamespace: genai-platform-dev
  timeout: 5m0s
  postBuild:
    substitute:
      ENV: dev
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: genai-platform-staging
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./deployment/kustomize/overlays/staging
  prune: true
  sourceRef:
    kind: GitRepository
    name: genai-platform
  targetNamespace: genai-platform-staging
  timeout: 5m0s
  dependsOn:
    - name: genai-platform-dev
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: genai-platform-prod
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./deployment/kustomize/overlays/prod
  prune: true
  sourceRef:
    kind: GitRepository
    name: genai-platform
  targetNamespace: genai-platform
  timeout: 5m0s
  dependsOn:
    - name: genai-platform-staging
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: genai-platform
      namespace: genai-platform
  postBuild:
    substitute:
      ENV: prod
