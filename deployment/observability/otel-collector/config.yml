# OpenTelemetry Collector config (issue #47).
#
# Receives OTLP/HTTP traces from the API (pipeline spans) and forwards them to
# Jaeger. Swap the ``exporters`` block for Tempo, Grafana Cloud, Datadog, etc.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]
