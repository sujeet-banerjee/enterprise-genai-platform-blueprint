# Smoke-test retrieval config: dummy retriever, no evaluation, no reranking.
retrieval:
  default_retriever: dummy
  top_k: 2
  similarity_metric: cosine
  low_score_threshold: 0.0
  avg_chunk_tokens: 128
  retrievers:
    dummy:
      provider: dummy

evaluation:
  enabled: false

reranking:
  enabled: false
