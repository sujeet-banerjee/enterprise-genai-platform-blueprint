# Production overlay: pinned tag, ingress, secrets from an existing Secret
# (External Secrets / cloud secret manager), tracing to the cluster collector.
# Multi-replica HA enabled in G3 (#68): share state via BaseStore (persistence)
# and ensure model cache uses RWX or is pre-warmed per node.
image:
  tag: "1.0.0"

replicaCount: 2

resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    cpu: "4"
    memory: 8Gi

modelCache:
  size: 50Gi
  accessMode: ReadWriteMany

secrets:
  existingSecret: genai-platform-secrets

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
  hosts:
    - host: genai.example.com
      paths:
        - path: /
          pathType: Prefix

observability:
  prometheus:
    scrape: true
  otel:
    enabled: true
    endpoint: http://otel-collector.observability.svc.cluster.local:4318/v1/traces

# HPA enabled (G3 #68): requires persistence (#56) for shared state.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
