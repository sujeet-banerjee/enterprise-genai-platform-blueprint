# Staging overlay: production-shaped wiring (secrets, tracing, scrape),
# multi-replica with shared persistence (G3 / #56).
image:
  tag: staging

replicaCount: 2

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi

modelCache:
  size: 20Gi
  accessMode: ReadWriteMany

secrets:
  existingSecret: genai-platform-secrets

observability:
  prometheus:
    scrape: true
  otel:
    enabled: true
    endpoint: http://otel-collector.observability.svc.cluster.local:4318/v1/traces

# HPA enabled (G3 #68): requires persistence (#56) for shared state.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
