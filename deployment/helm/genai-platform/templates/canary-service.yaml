{{- if and .Values.rollout.enabled (eq .Values.rollout.strategy "canary") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "genai-platform.fullname" . }}-canary
  labels:
    {{- include "genai-platform.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "genai-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
{{- end }}
