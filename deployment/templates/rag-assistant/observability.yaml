# Golden path: rag-assistant (issue #127) - redaction on, tracing off.
config_version: 1

log_level: INFO
redact_sensitive_data: true
low_retrieval_score_threshold: 0.2
sensitive_patterns:
  - "api[_-]?key"
  - "password"
  - "secret"
  - "token"
  - "authorization"
  - "bearer"

otel:
  enabled: false
  endpoint: ""
  service_name: "enterprise-genai-platform"
  sample_ratio: 1.0

pii:
  enabled: false
