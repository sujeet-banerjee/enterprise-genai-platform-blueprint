# Golden path: governed-enterprise (issue #127).
# Dummy providers keep this fast and deterministic for CI. Replace models.yaml
# and the retriever with your vendor/vector store; keep the policy files.
config_version: 1

active_model: dummy
active_embedding_model: dummy

models:
  dummy:
    provider: dummy
    context_window: 4096
    temperature: 0.0
    max_tokens: 128
  dummy-fallback:
    provider: dummy
    context_window: 4096
    temperature: 0.0
    max_tokens: 128

embedding_models:
  dummy:
    provider: dummy
    model_name: dummy-embedder
    dimension: 10
  dummy-fallback:
    provider: dummy
    model_name: dummy-embedder-fallback
    dimension: 10
