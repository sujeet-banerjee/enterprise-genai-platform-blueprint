# Tenant / workspace model (issue #48, workstream A1).
#
# Off by default: when ``enabled: false`` every request resolves to one implicit
# ``default`` tenant, so existing single-tenant deployments are unaffected.
#
# Enable it to serve multiple teams/apps from one deployment with isolated cache
# namespaces, spend history and audit attribution, plus per-tenant policy.
#
# With identity enabled (``identity.enabled: true``, issue #49) the caller is
# bound to the tenant in the JWT ``tenant`` claim (or the ``api_keys`` mapping
# for service accounts). ``X-Tenant-ID`` must then match that tenant; a
# contradicting header is rejected with 403 ``forbidden_tenant_scope`` unless
# the caller's role or key is allowlisted in ``header_override`` (issue #223).
#
# With identity disabled the legacy trusted-gateway ordering applies:
# ``X-Tenant-ID`` -> ``api_keys`` -> ``default_tenant``. Only use that mode when
# the API is not directly reachable by untrusted clients (e.g. an ingress
# strips/rewrites the header). An unknown explicit tenant is always rejected
# with a 400 ``unknown_tenant`` envelope (never a silent fallback).
enabled: false

default_tenant: default

tenants:
  default:
    workspace: default
    app: platform

  # Example tenant showing the full policy surface. Remove or adapt locally.
  example:
    workspace: example-prod
    app: support-copilot
    # Cost-center label used by the attribution reports (issue #50).
    cost_center: cc-1234
    # Hard cap on window spend (sum of RunHistory costs). Requests are rejected
    # with a 402 ``cost_limit_exceeded`` / ``tenant_budget_exceeded`` envelope
    # once the cap is reached.
    budget_cap_usd: 5.0
    # Retrieval depth cap applied on top of role/persona caps.
    top_k_max: 3
    # Models this tenant may use (declared for policy/introspection and future
    # model-selection enforcement).
    allowed_models:
      - local-qwen
    # Tenant overlay on top of global config/*.yaml (unspecified keys fall back
    # to global). Applied at request time where a value is request-scoped.
    overrides:
      retrieval:
        top_k: 2

# Optional API-key -> tenant mapping. Keys are never stored in the repo; this is
# a placeholder that operators fill in locally.
api_keys: {}

# Principals allowed to select a different tenant with X-Tenant-ID when identity
# is enabled. Empty by default (no cross-tenant selection). Service-account keys
# are compared by value and never echoed by /v1/tenants.
header_override:
  roles: []          # e.g. [admin] for a trusted operations role
  api_keys: []       # e.g. the key used by a trusted gateway/service account
