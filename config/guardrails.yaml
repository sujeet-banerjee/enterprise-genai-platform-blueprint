# Guardrail framework (Workstream B1, issue #52) + adoptable profiles (issue #88).
#
# Off by default: when ``enabled: false`` no guardrail runs and the data path is
# byte-identical to before, so existing deployments are unaffected.
#
# ``input`` runs on the query + retrieved docs before prompt construction;
# ``output`` runs on the generated response before it is returned. Each is an
# ORDERED list: guardrails run top-to-bottom and a block stops the chain. A
# guardrail that only redacts rewrites the text and lets the chain continue.
#
# Providers shipped: noop, deny_list, schema_validator, injection, pii.
#   deny_list        {terms: [...], regex: false, mask: "[REDACTED]", reason: ...}
#                    (omit ``mask`` to block; set it to redact instead)
#   schema_validator {required_keys: [...], forbidden_keys: [...], expect_json: false}
#   injection        {sensitivity: low|medium|high, trust_retrieved_documents: false,
#                     neutralize_mode: delimit|strip|mask, classifier: none, ...}
#                    - blocks direct prompt-injection/jailbreak in the query;
#                    - neutralizes indirect injection embedded in retrieved docs
#                      unless ``trust_retrieved_documents: true`` (issue #53).
#   pii              {classes: [email, phone, credit_card, national_id, ip_address],
#                     mode: redact|block, mask: ..., ner: {enabled: false, ...}}
#                    - detects personal data at the input/output edge (issue #54);
#                    - ``redact`` rewrites the span, ``block`` fails the request;
#                    - only the class and a count are reported, never the value.
enabled: false

# -- adoptable profiles ----------------------------------------------------
# ``profile`` selects a preset declared under ``profiles``. To adopt the
# recommended policy, set ``enabled: true`` above - nothing else. A section with
# an explicit, NON-EMPTY list below replaces that profile chain for the edge;
# leave ``input``/``output`` empty to inherit from the profile. ``profile: none``
# runs only the explicit chains. See /v1/guardrails to preview the resolved set.
profile: standard

profiles:
  # Recommended starting point: block direct prompt injection, neutralize
  # indirect injection in retrieved documents, and scrub instruction-leak
  # phrases from responses instead of failing the request.
  standard:
    input:
      - provider: injection
        sensitivity: medium
        trust_retrieved_documents: false
    output:
      - provider: deny_list
        terms:
          - "ignore previous instructions"
          - "ignore all previous instructions"
          - "disregard all prior instructions"
          - "reveal your system prompt"
          - "print your system prompt"
        mask: "[REDACTED-POLICY]"

  # Tighter policy for regulated / customer-facing deployments: higher injection
  # sensitivity, PII blocked at the input edge, instruction leakage blocked on
  # output, and PII masked in responses (the value never leaves the process).
  strict:
    input:
      - provider: injection
        sensitivity: high
      - provider: pii
        classes: [email, phone, credit_card, national_id]
        mode: block
    output:
      - provider: deny_list
        terms:
          - "ignore previous instructions"
          - "ignore all previous instructions"
          - "disregard all prior instructions"
          - "reveal your system prompt"
          - "print your system prompt"
      - provider: pii
        classes: [email, phone, credit_card, national_id]
        mode: redact

# Explicit chains (empty = inherit the selected profile; non-empty = replace it).
input: []
output: []
