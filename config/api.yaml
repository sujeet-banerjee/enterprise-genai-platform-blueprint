# API surface settings (issue #30).
#
# The API-key check is a config-driven stub, disabled by default, as a
# placeholder for the RBAC/persona system tracked in issue #29. When
# ``require_api_key`` is true, requests must send the key in the ``X-API-Key``
# header; ``/health``, ``/ready`` and the OpenAPI docs stay public.
require_api_key: false
api_key: ""

# Runtime component swap (issue #37). Disabled by default: the rebuild endpoint
# returns 403 until an operator explicitly opts in here.
allow_rebuild: false

# Bounded in-memory stores backing /v1/metrics, /v1/governance/status and
# /v1/traces/{request_id} (issue #38). Oldest entries are evicted first.
# Set these to 0 to disable recording; persistence is out of scope (issue #28).
history_max_runs: 1000
trace_store_max: 500

# Maximum number of queries accepted by POST /v1/query:batch (issue #39).
# Batches beyond this cap are rejected with a 400 standard envelope.
max_batch_size: 25
