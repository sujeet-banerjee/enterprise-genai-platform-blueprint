# API surface settings (issue #30).
#
# The API-key check is a config-driven stub, disabled by default, as a
# placeholder for the RBAC/persona system tracked in issue #29. When
# ``require_api_key`` is true, requests must send the key in the ``X-API-Key``
# header; ``/health``, ``/ready`` and the OpenAPI docs stay public.
require_api_key: false
api_key: ""

# Runtime component swap (issue #37). Disabled by default: the rebuild endpoint
# returns 403 until an operator explicitly opts in here.
allow_rebuild: false

# Bounded in-memory stores backing /v1/metrics, /v1/governance/status and
# /v1/traces/{request_id} (issue #38). Oldest entries are evicted first.
# Set these to 0 to disable recording; persistence is out of scope (issue #28).
history_max_runs: 1000
trace_store_max: 500

# Maximum number of queries accepted by POST /v1/query:batch (issue #39).
# Batches beyond this cap are rejected with a 400 standard envelope.
max_batch_size: 25

# Thread-pool concurrency cap for parallel batches (POST /v1/query:batch with
# ``parallel: true``; issue #27). Request ``max_workers`` is clamped to this.
batch_max_workers: 4

# Upper bound for ``page_size`` on the HITL approvals queue (issue #175).
# ``GET /v1/approvals`` rejects larger pages with a 400 ``approval_invalid``
# envelope; the default page size is 50.
approvals_page_size_max: 100

# Application-layer abuse protection (issue #224). Disabled by default so legacy
# single-tenant deployments behave exactly as before; enable it at the edge or
# alongside a gateway/WAF. This is a process-local token bucket plus in-flight
# cap, not a distributed quota: each replica enforces its own limits and the
# gateway/WAF remains responsible for global edge protection.
#
# ``scope`` selects the bucket identity: ``auto`` (subject -> API key -> tenant
# -> role -> client IP), ``key``, ``tenant``, ``role``, ``subject`` or ``ip``.
# API keys and subjects are hashed before use; raw values never enter metrics.
# A batch request consumes one token; ``max_batch_size`` and
# ``batch_max_workers`` still bound work inside that request. Tenant
# ``budget_cap_usd`` remains a separate post-hoc spend guard, not a rate limit.
rate_limit:
  enabled: false
  requests_per_minute: 60
  burst: 10
  scope: auto
  in_flight_max: 4
