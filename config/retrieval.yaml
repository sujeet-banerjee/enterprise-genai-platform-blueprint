retrieval:
  default_retriever: faiss
  top_k: 3
  similarity_metric: cosine
  low_score_threshold: 0.25
  avg_chunk_tokens: 128
  retrievers:
    faiss:
      provider: faiss
      documents_path: data/docs.json
    simple:
      provider: simple
      documents_path: data/docs.json
    dummy:
      provider: dummy

evaluation:
  enabled: true
  active_evaluator: semantic
  evaluators:
    dummy:
      provider: dummy
    engine:
      provider: engine
    semantic:
      provider: semantic
      model_name: sentence-transformers/all-MiniLM-L6-v2
    llm_judge:
      provider: llm_judge
      model_name: Qwen/Qwen2.5-0.5B-Instruct
      max_new_tokens: 128
    noop:
      provider: noop

reranking:
  enabled: true
  strategy: lexical_hybrid
  lexical_weight: 0.6
  initial_score_weight: 0.4
  top_k: 3
  active_reranker: simple
  rerankers:
    simple:
      provider: simple
    cross_encoder:
      provider: cross_encoder
      model_name: cross-encoder/ms-marco-MiniLM-L-6-v2
      top_k: 3
    dummy:
      provider: dummy
    none:
      provider: none

query_expansion:
  enabled: false
  active_expander: synonym
  max_variants: 3
  expanders:
    noop:
      provider: noop
    synonym:
      provider: synonym
      max_variants: 3
      synonyms:
        ai:
          - artificial intelligence
        ml:
          - machine learning
    llm:
      provider: llm
      max_variants: 3
      max_new_tokens: 64

chunking:
  active_strategy: small
  strategies:
    small:
      chunk_size: 120
      chunk_overlap: 20
      separator: " "
    large:
      chunk_size: 400
      chunk_overlap: 50
      separator: " "
    token:
      chunk_size: 128
      chunk_overlap: 20

token_budget:
  default_mode: strict
  max_output_cap: 512
  min_output_tokens: 16
  chars_per_token: 4
