retrieval:
  default_retriever: faiss
  top_k: 3
  similarity_metric: cosine
  low_score_threshold: 0.25
  avg_chunk_tokens: 128
  retrievers:
    faiss:
      provider: faiss
      similarity_metric: cosine
      documents_path: data/docs.json
    simple:
      provider: simple
      documents_path: data/docs.json
    dummy:
      provider: dummy

governance:
  enabled: true
  max_cost_per_request_usd: 0.05
  safety_margin_tokens: 200
  avg_chunk_tokens: 128

evaluation:
  enabled: true
  active_evaluator: semantic
  evaluators:
    dummy:
      provider: dummy
    engine:
      provider: engine
    semantic:
      provider: semantic
      model_name: sentence-transformers/all-MiniLM-L6-v2
    llm_judge:
      provider: llm_judge
      model_name: Qwen/Qwen2.5-0.5B-Instruct
      max_new_tokens: 128
    noop:
      provider: noop

reranking:
  enabled: true
  strategy: lexical_hybrid
  lexical_weight: 0.6
  initial_score_weight: 0.4
  top_k: 3
  active_reranker: simple
  rerankers:
    simple:
      provider: simple
    cross_encoder:
      provider: cross_encoder
      model_name: cross-encoder/ms-marco-MiniLM-L-6-v2
      top_k: 3
    dummy:
      provider: dummy
    none:
      provider: none

chunking:
  active_strategy: small
  strategies:
    small:
      chunk_size: 120
      chunk_overlap: 20
      separator: " "
    large:
      chunk_size: 400
      chunk_overlap: 50
      separator: " "
    token:
      chunk_size: 128
      chunk_overlap: 20

token_budget:
  default_mode: strict
  max_output_cap: 512
  min_output_tokens: 16
  chars_per_token: 4

observability:
  log_level: INFO
  redact_sensitive_data: true
  low_retrieval_score_threshold: 0.25
  sensitive_patterns:
    - "api[_-]?key"
    - "password"
    - "secret"
    - "token"
    - "authorization"
    - "bearer"
