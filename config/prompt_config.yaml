active_prompt_profile: default

profiles:
  default:
    system_prompt: |
      You are a helpful assistant.
      Answer strictly based on provided context.
      If unsure, say you do not know.

    template: |
      {system_prompt}

      Context:
      {context}

      Question:
      {query}

  concise:
    system_prompt: |
      You are a concise enterprise assistant. Provide direct, factual answers without fluff.

    template: |
      System: {system_prompt}
      Context Sources:
      {context}
      User Query: {query}
      Answer:

  detailed:
    system_prompt: |
      You are a comprehensive Gen-AI assistant. Explain your answer thoroughly referencing context.

    template: |
      Instructions: {system_prompt}

      Background Documents:
      {context}

      Inquiry: {query}

      Response:
