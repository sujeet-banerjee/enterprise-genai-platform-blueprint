active_model: dummy

models:
  dummy:
    provider: dummy
    context_window: 4096
    temperature: 0.2

  gpt-4:
    provider: openai
    context_window: 128000
    temperature: 0.2
    max_tokens: 512
    input_cost_per_1k: 0.03
    output_cost_per_1k: 0.06

  mistral-7b:
    provider: dummy
    context_window: 8192
    input_cost_per_1k: 0.002
    output_cost_per_1k: 0.002

