[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-genai-platform-blueprint"
version = "0.2.0"
description = "Enterprise GenAI / RAG platform blueprint with pluggable, vendor-neutral components"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.135.1",
    "openai==2.29.0",
    "pydantic==2.12.5",
    "PyYAML==6.0.3",
    "uvicorn>=0.30.0",
    "torch>=2.4.0",
    "transformers>=4.40.0",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.7.4",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]
ui = [
    "streamlit>=1.30",
    "requests>=2.31",
]

[tool.setuptools.packages.find]
include = ["app*", "core*", "ui*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", "__pycache__", ".venv", "venv", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
no_implicit_optional = true

[tool.coverage.run]
source = ["app", "core"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pass",
]
